org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler stores build-cache paths relative to the
# project root. On Windows, when the project lives on one drive (here D:)
# and the Flutter/Gradle package cache lives on another (Pub Cache defaults
# to C:), that relative-path computation is impossible across drive letters
# and crashes with "this and base files have different roots" while closing
# the cache for any Kotlin-source Flutter plugin (seen on url_launcher_android,
# image_picker_android, shared_preferences_android). Disabling incremental
# Kotlin compilation skips that codepath; full Kotlin recompiles are slower
# but reliable. Safe to remove if this project and its caches ever end up on
# the same drive.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
